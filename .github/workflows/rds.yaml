name: RDS CI/CD
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'backend_rds/**'
  pull_request:
    branches:
      - main
    paths:
      - 'backend_rds/**'
jobs:
  deploy-rds-to-ecr:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
          host:
          - ${{ vars.EC2_HOST_1 }}
          - ${{ vars.EC2_HOST_2 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS Credentials using static key
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}
        
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push RDS image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: bookstore/backend-rds
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./backend_rds
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ matrix.host }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
                aws ecr get-login-password --region ${{ secrets.AWS_DEFAULT_REGION }} | \
                docker login --username AWS --password-stdin ${{ secrets.ECR_REPOSITORY }}
                cd /home/ec2-user
                docker-compose pull backend-rds
                docker-compose up -d backend-rds   


