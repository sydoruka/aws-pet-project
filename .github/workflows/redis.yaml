name: Redis CI/CD
on:
  workflow_dispatch:
jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: "Configure AWS Credentials using static key"
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1
        
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Redis image to Amazon ECR
        env:
          ECR_REGISTRY: bookstore/backend-redis
          ECR_REPOSITORY: bookstore/backend-redis
          IMAGE_TAG: latest
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./bookstore/backend-redis
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

