services:
  backend-rds:
    image: 951343843019.dkr.ecr.eu-north-1.amazonaws.com/bookstore/backend-rds:1.0
    ports:
      - 8001:8000
    environment:
      - DB_HOST=mydb.cpc2euucayz2.eu-north-1.rds.amazonaws.com
      - DB_PORT=5432
      - DB_NAME=mydb
      - DB_USER=dbadmin
      - DB_PASSWORD=password

  backend-redis:
    image: 951343843019.dkr.ecr.eu-north-1.amazonaws.com/bookstore/backend-redis:1.0
    ports:
      - 8002:8000
    environment:
      - REDIS_HOST=master.redis-cluster.l4xtcj.eun1.cache.amazonaws.com
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_PASSWORD=

  frontend:
    image: 951343843019.dkr.ecr.eu-north-1.amazonaws.com/bookstore/frontend:1.0
    ports:
      - 3000:8000
    environment:
      - BACKEND_RDS_URL=http://backend-rds:8000/test_connection/
      - BACKEND_REDIS_URL=http://backend-redis:8000/test_connection/
    depends_on:
      - backend-rds
      - backend-redis

  nginx:
    image: nginx:alpine
    ports:
      - 80:80
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend